name: Fill dim 2025 days

# One-shot. Path filter means later empty commits will not re-run this.
on:
  push:
    paths:
      - ".github/workflows/fill-dim-days.yml"

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append unique backdated commits on faint letter days
        run: |
          set -euo pipefail
          git config user.name "Dennis Gavrilenko"
          git config user.email "dennisg009@gmail.com"
          python3 << 'PY'
          import os, subprocess
          DAYS = """2025-03-09
          2025-03-10
          2025-03-11
          2025-03-12
          2025-03-13
          2025-03-14
          2025-03-15
          2025-03-16
          2025-03-22
          2025-03-23
          2025-03-29
          2025-03-30
          2025-04-05
          2025-04-07
          2025-04-08
          2025-04-09
          2025-04-10
          2025-04-11
          2025-04-20
          2025-04-21
          2025-04-22
          2025-04-23
          2025-04-24
          2025-04-25
          2025-04-26
          2025-04-27
          2025-04-30
          2025-05-03
          2025-05-04
          2025-05-07
          2025-05-10
          2025-05-11
          2025-05-14
          2025-05-17
          2025-05-18
          2025-05-24
          2025-06-01
          2025-06-02
          2025-06-03
          2025-06-04
          2025-06-05
          2025-06-06
          2025-06-07
          2025-06-09
          2025-06-10
          2025-06-18
          2025-06-26
          2025-06-27
          2025-06-29
          2025-06-30
          2025-07-01
          2025-07-02
          2025-07-03
          2025-07-04
          2025-07-05
          2025-07-13
          2025-07-14
          2025-07-15
          2025-07-16
          2025-07-17
          2025-07-18
          2025-07-19
          2025-07-21
          2025-07-22""".split()
          n = 0
          for d in DAYS:
              for i in range(22):
                  stamp = f"{d}T12:{i:02d}:00+00:00"
                  env = {**os.environ, "GIT_AUTHOR_DATE": stamp, "GIT_COMMITTER_DATE": stamp}
                  subprocess.run(
                      ["git", "commit", "--allow-empty", "-q", "-m", f"art {d} fill {i}"],
                      env=env, check=True,
                  )
                  n += 1
          print(f"created {n} commits on {len(DAYS)} days")
          PY
          git push origin HEAD:main
