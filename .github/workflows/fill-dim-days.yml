name: Fill remaining faint 2025 days

on:
  push:
    paths:
      - ".github/workflows/fill-dim-days.yml"

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fill March and early April only
        run: |
          set -euo pipefail
          git config user.name "Dennis Gavrilenko"
          git config user.email "dennisg009@gmail.com"
          python3 << 'PY'
          import os, subprocess
          DAYS = """2025-03-09
          2025-03-10
          2025-03-11
          2025-03-12
          2025-03-13
          2025-03-14
          2025-03-15
          2025-03-16
          2025-03-22
          2025-03-23
          2025-03-29
          2025-03-30
          2025-04-05
          2025-04-07
          2025-04-08
          2025-04-09
          2025-04-10
          2025-04-11
          2025-04-20""".split()
          n = 0
          for d in DAYS:
              for i in range(22):
                  stamp = f"{d}T13:{i:02d}:00+00:00"
                  env = {**os.environ, "GIT_AUTHOR_DATE": stamp, "GIT_COMMITTER_DATE": stamp}
                  subprocess.run(
                      ["git", "commit", "--allow-empty", "-q", "-m", f"art {d} fill2 {i}"],
                      env=env, check=True,
                  )
                  n += 1
          print(f"created {n} commits on {len(DAYS)} days")
          PY
          git push origin HEAD:main
